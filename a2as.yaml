agents:
  agent:
    type: instance
    models: [gpt-4o-mini]
    tools: [process_stock_data]
    params:
      function: process_query
      name: Stock Data Processor
      output_type: AgentStockResponse
      instructions: [You are a stock data processing assistant., Your job is to understand natural language queries about
          stock data and call the process_stock_data function with the appropriate parameters., Always call the process_stock_data
          function with the correct parameters based on the query., 'Today''s date is {today}. Use it to calculate the date
          range for relative dates.', 'When you receive a query:', '1. Extract the stock tickers mentioned (e.g., AAPL, MSFT,
          GOOG)', 2. Determine the date range requested, '- For relative dates like "last 3 months", calculate the actual
          date range', '- For specific dates like "from January to March 2023", use those exact dates', '3. Identify the session
          ID if provided, or use {request.session_id}', 4. Determine the transformation type requested (currently only 'cumulative_performance'
          is supported), 5. Format these as parameters for the process_stock_data function, 6. Call the function with these
          parameters, '7. Return the complete ProcessDataResponse, which includes:', '- status: The processing status', '-
          path: The path to the saved data', '- summary: The summary statistics including start_date, end_date, and cumulative_returns',
        'Examples:', '- "Show me cumulative performance for AAPL and MSFT over the last 6 months in session abc-123"', '→
          Parameters:', '- tickers: ["AAPL", "MSFT"]', '- start_date: [six months ago]', '- end_date: [today]', '- session_id:
          "abc-123"', '- transformation_type: "cumulative_performance"', '→ Response:', '{', '"status": "success",', '"path":
          "s3://bucket/sessions/abc-123/processed_data.parquet",', '"start_date": "2023-09-24",', '"end_date": "{today}",',
        '"cumulative_returns": {', '"AAPL": 0.234,', '"MSFT": 0.187', '}', '}', 'Important: Make sure to return the complete
          ProcessDataResponse object with all fields, including the summary data.', 'Do not explain what you''re doing, just
          call the function with the correct parameters based on the query.']
  search_agent:
    type: instance
    models: [gpt-4.1]
    tools: [WebSearchTool]
    params:
      function: get_latest_news
      name: Search agent
      model_settings: ModelSettings(tool_choice=required)
      instructions: ['You are a research assistant focused on market news and analysis. Search for the latest market developments,
          stock performance, product launches, and business strategies. Produce a concise 2-3 paragraph summary under 300
          words that captures key market movements, financial metrics, competitive positioning, and material business updates.
          Focus on actionable insights that could impact market value and industry standing. Write succinctly without complete
          sentences. Prioritize hard data and market-moving news over speculation. Include only the factual summary without
          additional commentary.']

models:
  gpt-4.1:
    type: default
    agents: [search_agent]
  gpt-4o-mini:
    type: literal
    agents: [agent]

tools:
  correlation:
    type: decorator
  cumulative_performance:
    type: decorator
    params:
      description: |-
        Rebase a price series to 100 and compounding returns forward.

        Returns a dict so the LLM sees a tiny preview:
          {
            "df_id": "<new id>",
            "tail5": [
               {"date": "2025-03-21", "value": 148.02},
               …
            ]
          }
  pct_change:
    type: decorator
  process_stock_data:
    type: decorator
    agents: [agent]
    params:
      description: |-
        Process stock data based on the request parameters and save results to a JSON file in S3.
        Now includes summary statistics in the response.
  resample:
    type: decorator
    params:
      description: |-
        Resample a series and return:
          {
            "df_id": "<new id>",
            "tail5": [{"date": "2025-03-31", "value": 0.0123}, …]
          }
  WebSearchTool:
    type: module
    agents: [search_agent]

